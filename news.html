<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F5F1">
<title>今日時事</title>
<style>
:root{
  --yellow:#FFD400;
  --bg:#F6F5F1;
  --card:#FFFFFF;
  --card2:#FFFDF4;
  --line:#E5E2DA;
  --ink:#16161A;
  --grey:#8A8880;
  --green:#3FA96C;
  --green-bg:#F0F9F3;
  --red:#D95050;
  --red-bg:#FBEFEF;
  --hl:#FFF8D6;
  --amber:#C8860A;
  --amber-bg:#FBF3E0;
  --shadow:0 4px 18px rgba(22,22,26,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141416;
    --card:#1E1E22;
    --card2:#232320;
    --line:#33333A;
    --ink:#F2F1EC;
    --grey:#9B998F;
    --green:#5CC488;
    --green-bg:#1C2B22;
    --red:#E37070;
    --red-bg:#2E1E1E;
    --hl:#2E2A18;
    --amber:#E0A93C;
    --amber-bg:#2E2812;
    --shadow:0 4px 18px rgba(0,0,0,.35);
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{
  font-family:"PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:60px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* header */
header{
  padding:calc(env(safe-area-inset-top) + 18px) 0 10px;
}
.h-top{display:flex;align-items:baseline;gap:8px}
h1{font-size:24px;font-weight:800;letter-spacing:1px}
h1 .dot{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--yellow);margin-right:6px}
.updated{font-size:12px;color:var(--grey);margin-left:auto;text-align:right;line-height:1.4}
.sub{font-size:13px;color:var(--grey);margin-top:4px}

/* date chips */
.dates{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dchip{
  flex:0 0 auto;padding:7px 14px;border-radius:20px;font-size:14px;font-weight:600;
  background:var(--card);border:1px solid var(--line);color:var(--grey);
  cursor:pointer;user-select:none;font-family:inherit;white-space:nowrap;
}
.dchip.on{background:var(--yellow);color:#16161A;border-color:var(--yellow)}

/* cards */
.day-title{font-size:13px;color:var(--grey);margin:14px 2px 10px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow);
}
.card.hot{border-color:var(--yellow);border-width:1.5px;background:var(--card2)}
.c-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.cat{
  font-size:12px;font-weight:700;padding:3px 9px;border-radius:12px;letter-spacing:.5px;
}
.cat-edit{background:var(--hl);color:var(--amber)}
.cat-ai{background:var(--green-bg);color:var(--green)}
.cat-tw{background:var(--red-bg);color:var(--red)}
.cat-etc{background:var(--amber-bg);color:var(--amber)}
.hotmark{font-size:12px;font-weight:700;color:var(--amber)}
.c-title{font-size:18px;font-weight:800;line-height:1.35;margin-bottom:8px}
.c-body{font-size:15px;line-height:1.65;color:var(--ink);opacity:.92}
.c-why{
  margin-top:10px;background:var(--hl);border-radius:10px;padding:10px 12px;
  font-size:14px;line-height:1.55;font-weight:600;
}
.c-why::before{content:"→ 跟你的關係　";color:var(--amber);font-size:12px;font-weight:800;display:block;margin-bottom:2px;letter-spacing:1px}
.c-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.c-links a{
  font-size:12px;color:var(--grey);text-decoration:none;
  border:1px solid var(--line);border-radius:12px;padding:3px 10px;
}
.c-links a:active{background:var(--hl)}

/* states */
.state{padding:60px 0;text-align:center;color:var(--grey);font-size:14px;line-height:1.8}
footer{margin-top:24px;text-align:center;font-size:12px;color:var(--grey);line-height:1.7;padding:0 20px}
footer a{color:var(--grey)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="h-top">
      <h1><span class="dot"></span>今日時事</h1>
      <div class="updated" id="updated"></div>
    </div>
    <div class="sub">剪輯圈・AI圈・台灣正在討論的事，每天自動更新</div>
  </header>

  <div class="dates" id="dates"></div>
  <div id="feed"><div class="state">載入中⋯</div></div>

  <footer>
    由 Claude 每天早上自動蒐集整理。<br>
    來源是新聞站與搜尋引擎，社群最熱的帖有時會慢半天到一天。<br>
    <a href="index.html">← 回網感訓練</a>
  </footer>
</div>

<script>
const CATS = {edit:['✂️ 剪輯圈','cat-edit'], ai:['🤖 AI圈','cat-ai'], tw:['🇹🇼 台灣時事','cat-tw'], etc:['📌 其他','cat-etc']};
let DATA = null, cur = null;

function fmtDate(s){
  const [y,m,d] = s.split('-').map(Number);
  const wd = '日一二三四五六'[new Date(y, m-1, d).getDay()];
  return m + '/' + d + '（' + wd + '）';
}

function render(){
  const day = DATA.days.find(x => x.date === cur);
  const feed = document.getElementById('feed');
  if(!day || !day.items.length){
    feed.innerHTML = '<div class="state">這天沒有資料</div>';
    return;
  }
  feed.innerHTML = day.items.map(it => {
    const [label, cls] = CATS[it.cat] || CATS.etc;
    return '<div class="card' + (it.hot ? ' hot' : '') + '">'
      + '<div class="c-head"><span class="cat ' + cls + '">' + label + '</span>'
      + (it.hot ? '<span class="hotmark">🔥 今日最熱</span>' : '') + '</div>'
      + '<div class="c-title">' + it.title + '</div>'
      + '<div class="c-body">' + it.body + '</div>'
      + (it.why ? '<div class="c-why">' + it.why + '</div>' : '')
      + (it.links && it.links.length
          ? '<div class="c-links">' + it.links.map(l =>
              '<a href="' + l.u + '" target="_blank" rel="noopener">' + l.t + ' ↗</a>').join('') + '</div>'
          : '')
      + '</div>';
  }).join('');
}

function renderDates(){
  const el = document.getElementById('dates');
  el.innerHTML = DATA.days.map(d =>
    '<button class="dchip' + (d.date === cur ? ' on' : '') + '" data-d="' + d.date + '">'
    + fmtDate(d.date) + '</button>').join('');
  el.querySelectorAll('.dchip').forEach(b => b.onclick = () => { cur = b.dataset.d; renderDates(); render(); });
}

fetch('data/news.json?t=' + Date.now())
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    DATA = d;
    DATA.days.sort((a,b) => b.date.localeCompare(a.date));
    cur = DATA.days[0] && DATA.days[0].date;
    document.getElementById('updated').textContent = '更新於 ' + d.updated;
    renderDates(); render();
  })
  .catch(e => {
    document.getElementById('feed').innerHTML =
      '<div class="state">資料載入失敗（' + e.message + '）<br>下拉重新整理試試</div>';
  });
</script>
</body>
</html>
