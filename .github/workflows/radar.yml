name: 風向雷達每日更新
on:
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 台北早上 8 點
  workflow_dispatch: {}    # 也可以手動按按鈕跑

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓資料
        run: python scripts/fetch_radar.py
      - name: 提交更新
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/radar.json data/history.json data/music.json
          git diff --cached --quiet || git commit -m "radar: $(date -u '+%Y-%m-%d') 自動更新"
          git push
